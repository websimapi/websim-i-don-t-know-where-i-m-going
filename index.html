<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Don't Know Where I'm Going</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="style.css">
    <script>
        // Import map for libraries
        const im = document.createElement('script');
        im.type = 'importmap';
        im.textContent = JSON.stringify({
            imports: {
                "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
                "leaflet-routing-machine": "https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.esm.js"
            }
        });
        document.head.appendChild(im);
    </script>
</head>
<body>
    <div id="map"></div>
    <div id="ui-container">
        <h1>I Don't Know Where I'm Going</h1>
        <p id="instructions">Click "Start Game" to begin. You'll be given a start and end point. Use your voice to give the bot directions to follow the route!</p>
        <button id="start-button">Start Game</button>
        <div id="game-info" class="hidden">
            <p>From: <strong id="start-city"></strong></p>
            <p>To: <strong id="end-city"></strong></p>
            <div id="current-instruction-container">
                <p>Next instruction:</p>
                <p id="current-instruction">...</p>
            </div>
            <p>Your command: <strong id="user-command">...</strong></p>
            <p>Bot status: <strong id="bot-status">Waiting to start...</strong></p>
        </div>
    </div>
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p>Thinking of a journey...</p>
    </div>

    <script src="script.js" type="module"></script>

</body>
</html>
